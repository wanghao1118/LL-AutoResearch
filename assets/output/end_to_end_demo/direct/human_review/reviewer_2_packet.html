<html lang="zh-CN">
<head>

  <style>
    :root { color-scheme: light; --ink:#172033; --muted:#5d687d; --line:#d8deea; --paper:#f6f8fc; --card:#fff; --accent:#3157d5; --good:#17754d; --warn:#a45a00; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header { background:linear-gradient(120deg,#172033,#3157d5); color:white; padding:36px max(24px,calc((100vw - 1180px)/2)); }

    header p { margin:0; max-width:900px; opacity:.9; }
    main { max-width:1180px; margin:24px auto 80px; padding:0 24px; }

    .panel { padding:22px; margin-bottom:20px; }
    .item { margin:24px 0; overflow:hidden; }
    .item-head { padding:20px 22px; background:#edf2ff; border-bottom:1px solid var(--line); }
    .item-body { padding:22px; }
    h2,h3,h4 { line-height:1.25; }
    h2 { margin:0 0 6px; }
    h3 { margin:24px 0 10px; }
    .meta { color:var(--muted); }
    .pill { display:inline-block; margin:4px 7px 4px 0; padding:3px 9px; border-radius:999px; background:#e7ecfa; font-size:13px; }
    pre { white-space:pre-wrap; overflow-wrap:anywhere; background:#f7f8fb; border:1px solid var(--line); padding:14px; border-radius:10px; }
    details { margin:10px 0; border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
    summary { cursor:pointer; font-weight:650; }
    .rubric { display:grid; grid-template-columns:minmax(230px,1fr) 130px; gap:10px 18px; align-items:center; padding:13px 0; border-bottom:1px solid #edf0f5; }
    .rubric:last-child { border-bottom:0; }
    .rubric label { font-weight:650; }
    .rubric small { display:block; color:var(--muted); font-weight:400; }
    input[type="number"],input[type="text"],select,textarea { width:100%; border:1px solid #b8c1d3; border-radius:8px; padding:9px 10px; background:white; color:var(--ink); font:inherit; }
    textarea { min-height:110px; resize:vertical; }
    .check { display:flex; gap:9px; align-items:flex-start; margin:12px 0; }
    .check input { margin-top:5px; }
    .actions { position:sticky; bottom:0; display:flex; gap:12px; align-items:center; background:rgba(255,255,255,.96); border:1px solid var(--line); border-radius:12px; padding:14px 16px; box-shadow:0 -5px 24px rgba(29,43,76,.10); }
    button { border:0; border-radius:9px; padding:10px 16px; background:var(--accent); color:white; cursor:pointer; font-weight:700; }
    button.secondary { background:#e9edf7; color:var(--ink); }
    #message { color:var(--warn); font-weight:650; }
    a { color:var(--accent); }
    @media (max-width:700px) { .rubric { grid-template-columns:1fr; } .actions { flex-wrap:wrap; } }
  </style>

  <header>
    <h1>Auto-Bench Independent Review · REVIEWER_2</h1>
    <p>每位评审独立检查完整的 Introduction、Method、候选证据、指标、适配与合成方案；本页面不包含另一位评审的答案，也不包含论文隐藏实验标签。</p>

 the ability to seamlessly combine task-oriented actions with verbal reasoning (or inner speech, ), which has been theorized to play an important role in human cognition for enabling self-regulation or strategization and maintaining a working memory . Consider the example of cooking up a dish in the kitchen. Between any two specific actions, we may reason in language in order to track progress (``now that everything is cut, I should heat up the pot of water’’), to handle exceptions or adjust the plan according to the situation (``I don’t have salt, so let me use soy sauce and pepper instead’’), and to realize when external information is needed (``how do I prepare dough? Let me search on the Internet’’). We may also act (open a cookbook to read the recipe, open the fridge, check ingredients) to support the reasoning and to answer questions (``What dish can I make right now?''). This tight synergy between ``acting'’ and ``reasoning'’ allows humans to learn new tasks quickly and perform robust decision making or reasoning, even under previously unseen circumstances or facing information uncertainties. Recent results have hinted at the possibility of combining verbal reasoning with interactive decision making in autonomous systems. On one hand, properly prompted large language models (LLMs) have demonstrated emergent capabilities to carry out several steps of reasoning traces to derive answers from questions in arithmetic, commonsense, and symbolic reasoning tasks . However, this ``chain-of-thought’' reasoning is a static black box, in that the model uses its own internal representations to generate thoughts and is not grounded in the external world, which limits its ability to reason reactively or update its knowledge. This can lead to issues like fact hallucination and error propagation over the reasoning process (Figure (1b)). On the other hand, recent work has explored the use of pre-trained language models for planning and acting in interactive environments , with a focus on predicting actions via language priors. These approaches usually convert multi-modal observations into text, use a language model to generate domain-specific actions or plans, and then use a controller to choose or execute them. However, they do not employ language models to reason abstractly about high-level goals or maintain a working memory to support acting, barring who perform a limited form of verbal reasoning to reiterate spatial facts about the current state. Beyond such simple embodied tasks to interact with a few blocks, there have not been studies on how reasoning and acting can be combined in a synergistic manner for general task solving, and if such a combination can bring systematic benefits compared to reasoning or acting alone. In this work, we present METHOD_X, a general paradigm to combine reasoning and acting with language models for solving diverse language reasoning and decision making tasks (Figure ). METHOD_X prompts LLMs to generate both verbal reasoning traces and actions pertaining to a task in an interleaved manner, which allows the model to perform dynamic reasoning to create, maintain, and adjust high-level plans for acting (reason to act), while also interact with the external environments (e.g.\\,Wikipedia) to incorporate additional information into reasoning (act to reason). The best approach overall is a combination of METHOD_X and REASONING_BASELINE that allows for the use of both internal knowledge and externally obtained information during reasoning. We also demonstrate the importance of sparse, versatile reasoning in decision making by showing consistent advantages over controlled baselines with actions only. Besides general applicability and performance boost, the combination of reasoning and acting also contributes to model interpretability, trustworthiness, and diagnosability across all domains, as humans can readily distinguish information from model's internal knowledge versus external environments, as well as inspect reasoning traces to understand the decision basis of model actions. To summarize, our key contributions are the following: (1) we introduce METHOD_X, a novel prompt-based paradigm to synergize reasoning and acting in language models for general task solving; (2) we perform extensive experiments across diverse benchmarks to showcase the advantage of METHOD_X in a few-shot learning setup over prior approaches that perform either reasoning or action generation in isolation; (3) we present systematic ablations and analysis to understand the importance of acting in reasoning tasks, and reasoning in interactive tasks; (4) we analyze the limitations of METHOD_X under the prompting setup (i.e.\\,limited support of reasoning and acting behaviors), and perform initial finetuning experiments showing the potential of METHOD_X to improve with additional training data. Scaling up METHOD_X to train and operate on more tasks and combining it with complementary paradigms like reinforcement learning could further unlock the potential of large language models.", "method": "METHOD_X: Synergizing Reasoning + Acting Consider a general setup of an agent interacting with an environment for task solving. At time step , an agent receives an observation from the environment and takes an action following some policy , where is the context to the agent. Learning a policy is challenging when the mapping is highly implicit and requires extensive computation. For example, the agent shown in Figure (1c) is unable to generate the correct final action (Act 4) to finish the QA task as it requires complex reasoning over the trajectory context (Question, Act 1-3, Obs 1-3). Similarly, the agent shown in Figure (2a) fails to comprehend from the context that sinkbasin 1 does not contain peppershaker 1, thus keep producing hallucinating actions. The idea of METHOD_X is simple: we augment the agent's action space to , where is the space of language. An action in the language space, which we will refer to as a thought or a reasoning trace, does not affect the external environment, thus leading to no observation feedback. Instead, a thought aims to compose useful information by reasoning over the current context , and update the context to support future reasoning or acting. As shown in Figure , there could be various types of useful thoughts, e.g.\\,decomposing task goals and create action plans (2b, Act 1; 1d, Thought 1), injecting commonsense knowledge relevant to task solving (2b, Act 1), extracting important parts from observations (1d, Thought2, 4), track progress and transit action plans (2b, Act 8), handle exceptions and adjust action plans (1d, Thought 3), and so on. However, as the language space is unlimited, learning in this augmented action space is difficult and requires strong language priors. , is prompted with few-shot in-context examples to generate both domain-specific actions and free-form language thoughts for task solving (Figure (1d), (2b)). Each in-context example is a human trajectory of actions, thoughts, and environment observations to solve a task instance (see Appendix ). For the tasks where reasoning is of primary importance (Figure (1)), we alternate the generation of thoughts and actions so that the task-solving trajectory consists of multiple thought-action-observation steps. In contrast, for decision making tasks that potentially involve a large number of actions (Figure (2)), thoughts only need to appear sparsely in the most relevant positions of a trajectory, so we let the language model decide the asynchronous occurrence of thoughts and actions for itself. Since decision making and reasoning capabilities are integrated into a large language model, METHOD_X enjoys several unique features: A) Intuitive and easy to design: Designing METHOD_X prompts is straightforward as human annotators just type down their thoughts in language on top of their actions taken. No ad-hoc format choice, thought design, or example selection is used in with interactive decision making in autonomous systems. On one hand, properly prompted large language models (LLMs) have demonstrated emergent capabilities to carry out several steps of reasoning traces to derive answers from questions in arithmetic, commonsense, and symbolic reasoning tasks . However, this ``chain-of-thought’' reasoning is a static black box, in that the model uses its own internal representations to generate thoughts and is not grounded in the external world, which limits its ability to reason reactively or update its knowledge. This can lead to issues like fact hallucination and error propagation over the reasoning process (Figure (1b)). On the other hand, recent work has explored the use of pre-trained language models for planning and acting in interactive environments , with a focus on predicting actions via language priors. These approaches usually convert multi-modal observations into text, use a language model to generate domain-specific actions or plans, and then use a controller to choose or execute them. However, they do not employ language models to reason abstractly about high-level goals or maintain a working memory to support acting, barring who perform a limited form of verbal reasoning to reiterate spatial facts about the current state. Beyond such simple embodied tasks to interact with a few blocks, there have not been studies on how reasoning and acting can be combined in a synergistic manner for general task solving, and if such a combination can bring systematic benefits compared to reasoning or acting alone. In this work, we present METHOD_X, a general paradigm to combine reasoning and acting with language models for solving diverse language reasoning and decision making tasks (Figure ). METHOD_X prompts LLMs to generate both verbal reasoning traces and actions pertaining to a task in an interleaved manner, which allows the model to perform dynamic reasoning to create, maintain, and adjust high-level plans for acting (reason to act), while also interact with the external environments (e.g.\\,Wikipedia) to incorporate additional information into reasoning (act to reason). The best approach overall is a combination of METHOD_X and REASONING_BASELINE that allows for the use of both internal knowledge and externally obtained information during reasoning. We also demonstrate the importance of sparse, versatile reasoning in decision making by showing consistent advantages over controlled baselines with actions only. Besides general applicability and performance boost, the combination of reasoning and acting also contributes to model interpretability, trustworthiness, and diagnosability across all domains, as humans can readily distinguish information from model's internal knowledge versus external environments, as well as inspect reasoning traces to understand the decision basis of model actions. To summarize, our key contributions are the following: (1) we introduce METHOD_X, a novel prompt-based paradigm to synergize reasoning and acting in language models for general task solving; (2) we perform extensive experiments across diverse benchmarks to showcase the advantage of METHOD_X in a few-shot learning setup over prior approaches that perform either reasoning or action generation in isolation; (3) we present systematic ablations and analysis to understand the importance of acting in reasoning tasks, and reasoning in interactive tasks; (4) we analyze the limitations of METHOD_X under the prompting setup (i.e.\\,limited support of reasoning and acting behaviors), and perform initial finetuning experiments showing the potential of METHOD_X to improve with additional training data. Scaling up METHOD_X to train and operate on more tasks and combining it with complementary paradigms like reinforcement learning could further unlock the potential of large language models.", "method": "METHOD_X: Synergizing Reasoning + Acting Consider a general setup of an agent interacting with an environment for task solving. At time step , an agent receives an observation from the environment and takes an action following some policy , where is the context to the agent. Learning a policy is challenging when the mapping is highly implicit and requires extensive computation. For example, the agent shown in Figure (1c) is unable to generate the correct final action (Act 4) to finish the QA task as it requires complex reasoning over the trajectory context (Question, Act 1-3, Obs 1-3). Similarly, the agent shown in Figure (2a) fails to comprehend from the context that sinkbasin 1 does not contain peppershaker 1, thus keep producing hallucinating actions. The idea of METHOD_X is simple: we augment the agent's action space to , where is the space of language. An action in the language space, which we will refer to as a thought or a reasoning trace, does not affect the external environment, thus leading to no observation feedback. Instead, a thought aims to compose useful information by reasoning over the current context , and update the context to support future reasoning or acting. As shown in Figure , there could be various types of useful thoughts, e.g.\\,decomposing task goals and create action plans (2b, Act 1; 1d, Thought 1), injecting commonsense knowledge relevant to task solving (2b, Act 1), extracting important parts from observations (1d, Thought2, 4), track progress and transit action plans (2b, Act 8), handle exceptions and adjust action plans (1d, Thought 3), and so on. However, as the language space is unlimited, learning in this augmented action space is difficult and requires strong language priors. , is prompted with few-shot in-context examples to generate both domain-specific actions and free-form language thoughts for task solving (Figure (1d), (2b)). Each in-context example is a human trajectory of actions, thoughts, and environment observations to solve a task instance (see Appendix ). For the tasks where reasoning is of primary importance (Figure (1)), we alternate the generation of thoughts and actions so that the task-solving trajectory consists of multiple thought-action-observation steps. In contrast, for decision making tasks that potentially involve a large number of actions (Figure (2)), thoughts only need to appear sparsely in the most relevant positions of a trajectory, so we let the language model decide the asynchronous occurrence of thoughts and actions for itself. Since decision making and reasoning capabilities are integrated into a large language model, METHOD_X enjoys several unique features: A) Intuitive and easy to design: Designing METHOD_X prompts is straightforward as human annotators just type down their thoughts in language on top of their actions taken. No ad-hoc format choice, thought design, or example selection is used in this paper. We detail prompt design for each task in Sections and . B) General and flexible: Due to the flexible thought space and thought-action occurrence format, METHOD_X works for diverse tasks with distinct action spaces and reasoning needs, including but not limited to QA, fact verification, text game, and web navigation. We also show in Section additional benefits when finetuning is enabled, and in Section how METHOD_X performance is robust to prompt selections. D) Human aligned and controllable: METHOD_X promises an interpretable sequential decision making and reasoning process where humans can easily inspect reasoning and factual correctness. Moreover, humans can also control or correct the agent behavior on the go by thought editing, as shown in Figure in Section .", "constraints": {"input_scope": ["introduction", "method"], "paper_identity_hidden": true, "benchmark_names_redacted": true, "experiment_sections_excluded": true}}, "route": "direct_portfolio", "route_reason": "portfolio covers 100.0% of inferred task families; weakest task-normalized selected compatibility is 0.870", "coverage_ratio": 1.0, "profile": {"task_families": ["embodied_household", "fact_verif heat up the pot of water’’), to handle exceptions or adjust the plan according to the situation (``I don’t have salt, so let me use soy sauce and pepper instead’’), and to realize when external information is needed (``how do I prepare dough? Let me search on the Internet’’). We may also act (open a cookbook to read the recipe, open the fridge, check ingredients) to support the reasoning and to answer questions (``What dish can I make right now?''). This tight synergy between ``acting'’ and ``reasoning'’ allows humans to learn new tasks quickly and perform robust decision making or reasoning, even under previously unseen circumstances or facing information uncertainties. Recent results have hinted at the possibility of combining verbal reasoning with interactive decision making in autonomous systems. On one hand, properly prompted large language models (LLMs) have demonstrated emergent capabilities to carry out several steps of reasoning traces to derive answers from questions in arithmetic, commonsense, and symbolic reasoning tasks . However, this ``chain-of-thought’' reasoning is a static black box, in that the model uses its own internal representations to generate thoughts and is not grounded in the external world, which limits its ability to reason reactively or update its knowledge. This can lead to issues like fact hallucination and error propagation over the reasoning process (Figure (1b)). On the other hand, recent work has explored the use of pre-trained language models for planning and acting in interactive environments , with a focus on predicting actions via language priors. These approaches usually convert multi-modal observations into text, use a language model to generate domain-specific actions or plans, and then use a controller to choose or execute them. However, they do not employ language models to reason abstractly about high-level goals or maintain a working memory to support acting, barring who perform a limited form of verbal reasoning to reiterate spatial facts about the current state. Beyond such simple embodied tasks to interact with a few blocks, there have not been studies on how reasoning and acting can be combined in a synergistic manner for general task solving, and if such a combination can bring systematic benefits compared to reasoning or acting alone. In this work, we present METHOD_X, a general paradigm to combine reasoning and acting with language models for solving diverse language reasoning and decision making tasks (Figure ). METHOD_X prompts LLMs to generate both verbal reasoning traces and actions pertaining to a task in an interleaved manner, which allows the model to perform dynamic reasoning to create, maintain, and adjust high-level plans for acting (reason to act), while also interact with the external environments (e.g.\\,Wikipedia) to incorporate additional information into reasoning (act to reason). The best approach overall is a combination of METHOD_X and REASONING_BASELINE that allows for the use of both internal knowledge and externally obtained information during reasoning. We also demonstrate the importance of sparse, versatile reasoning in decision making by showing consistent advantages over controlled baselines with actions only. Besides general applicability and performance boost, the combination of reasoning and acting also contributes to model interpretability, trustworthiness, and diagnosability across all domains, as humans can readily distinguish information from model's internal knowledge versus external environments, as well as inspect reasoning traces to understand the decision basis of model actions. To summarize, our key contributions are the following: (1) we introduce METHOD_X, a novel prompt-based paradigm to synergize reasoning and acting in language models for general task solving; (2) we perform extensive experiments across diverse benchmarks to showcase the advantage of METHOD_X in a few-shot learning setup over prior approaches that perform either reasoning or action generation in isolation; (3) we present systematic ablations and analysis to understand the importance of acting in reasoning tasks, and reasoning in interactive tasks; (4) we analyze the limitations of METHOD_X under the prompting setup (i.e.\\,limited support of reasoning and acting behaviors), and perform initial finetuning experiments showing the potential of METHOD_X to improve with additional training data. Scaling up METHOD_X to train and operate on more tasks and combining it with complementary paradigms like reinforcement learning could further unlock the potential of large language models.", "method": "METHOD_X: Synergizing Reasoning + Acting Consider a general setup of an agent interacting with an environment for task solving. At time step , an agent receives an observation from the environment and takes an action following some policy , where is the context to the agent. Learning a policy is challenging when the mapping is highly implicit and requires extensive computation. For example, the agent shown in Figure (1c) is unable to generate the correct final action (Act 4) to finish the QA task as it requires complex reasoning over the trajectory context (Question, Act 1-3, Obs 1-3). Similarly, the agent shown in Figure (2a) fails to comprehend from the context that sinkbasin 1 does not contain peppershaker 1, thus keep producing hallucinating actions. The idea of METHOD_X is simple: we augment the agent's action space to , where is the space of language. An action in the language space, which we will refer to as a thought or a reasoning trace, does not affect the external environment, thus leading to no observation feedback. Instead, a thought aims to compose useful information by reasoning over the current context , and update the context to support future reasoning or acting. As shown in Figure , there could be various types of useful thoughts, e.g.\\,decomposing task goals and create action plans (2b, Act 1; 1d, Thought 1), injecting commonsense knowledge relevant to task solving (2b, Act 1), extracting important parts from observations (1d, Thought2, 4), track progress and transit action plans (2b, Act 8), handle exceptions and adjust action plans (1d, Thought 3), and so on. However, as the language space is unlimited, learning in this augmented action space is difficult and requires strong language priors. , is prompted with few-shot in-context examples to generate both domain-specific actions and free-form language thoughts for task solving (Figure (1d), (2b)). Each in-context example is a human trajectory of actions, thoughts, and environment observations to solve a task instance (see Appendix ). For the tasks where reasoning is of primary importance (Figure (1)), we alternate the generation of thoughts and actions so that the task-solving trajectory consists of multiple thought-action-observation steps. In contrast, for decision making tasks that potentially involve a large number of actions (Figure (2)), thoughts only need to appear sparsely in the most relevant positions of a trajectory, so we let the language model decide the asynchronous occurrence of thoughts and actions for itself. Since decision making and reasoning capabilities are integrated into a large language model, METHOD_X enjoys several unique features: A) Intuitive and easy to design: Designing METHOD_X prompts is straightforward as human annotators just type down their thoughts in language on top of their actions taken. No ad-hoc format choice, thought design, or example selection is used in this paper. We detail prompt design for each task in Sections and . B) General and flexible: Due to the flexible thought space and thought-action occurrence format, METHOD_X works for diverse tasks with distinct action spaces and reasoning needs, including but not limited to QA, fact verification, text game, and web navigation. We also show in Section additional benefits when finetuning is enabled, and in Section how METHOD_X performance is robust to prompt selections. D) Human aligned and controllable: METHOD_X promises an interpretable sequential decision making and reasoning process where humans can easily inspect reasoning and factual correctness. Moreover, humans can also control or correct the agent behavior on the go by thought editing, as shown in Figure in Section .", "constraints": {"input_scope": ["introduction", "method"], "paper_identity_hidden": true, "benchmark_names_redacted": true, "experiment_sections_excluded": true}}, "route": "direct_portfolio", "route_reason": "portfolio covers 100.0% of inferred task families; weakest task-normalized selected compatibility is 0.870", "coverage_ratio": 1.0, "profile": {"task_families": ["embodied_household", "fact_verification", "knowledge_intensive_qa", "sequential_decision_making", "web_navigation"], "uncovered_task_families": [], "modalities": ["audio", "text", "web"], "interactions": ["browser", "interactive_environment", "retrieval_tool"], "output_types": ["action_trajectory", "classification_label", "short_answer", "supporting_evidence"], "environments": ["knowledge_base", "website"], "capabilities": ["evidence_grounding", "external_information_retrieval", "long_horizon_planning", "reasoning_action_interleaving", "tool_use"], "suggested_metrics": ["evidence_score", "exact_match", "label_accuracy", "task_success_rate", "token_f1", "trajectory_efficiency"], "evidence_terms": {"capability:evidence_grounding": ["grounded", "factual"], "capability:external_information_retrieval": ["search"], "capability:long_horizon_planning": ["plan", "trajectory"], "capability:reasoning_action_interleaving": ["reasoning and acting", "thought-action-observation", "interleave"], "capability:tool_use": ["action"], "task:embodied_household": ["embodied"], "task:fact_verification": ["fact verification"], "task:knowledge_intensive_qa": ["answer questions", "wikipedia"], "task:sequential_decision_making": ["sequential decision", "action-observation", "trajecto s": [], "generic_evaluation_terms": []}, "catalog_records": 20, "online_search": false, "decision_backend": "deterministic_profile_and_weighted_compatibility_v1"}, "source_plan": "assets/output/end_to_end_demo/direct/benchmark_plan.json"}, {"case_id": "case_001", "benchmark_id": "visualwebarena", "visible_input": {"introduction": "Introduction. A unique feature of human intelligence is the ability to seamlessly combine task-oriented actions with verbal reasoning (or inner speech, ), which has been theorized to play an important role in human cognition for enabling self-regulation or strategization and maintaining a working memory . Consider the example of cooking up a dish in the kitchen. Between any two specific actions, we may reason in language in order to track progress (``now that everything is cut, I should heat up the pot of water’’), to handle exceptions or adjust the plan according to the situation (``I don’t have salt, so let me use soy sauce and pepper instead’’), and to realize when external information is needed (``how do I prepare dough? Let me search on the Internet’’). We may also act (open a cookbook to read the recipe, open the fridge, check ingredients) to support the reasoning and to answer questions (``What dish can I make right now?''). This tight synergy between ``acting'’ and ``reasoning'’ allows humans to learn new tasks quickly and perform robust decision making or reasoning, even under previously unseen circumstances or facing information uncertainties. Recent results have hinted at the possibility of combining verbal reasoning with interactive decision making in autonomous systems. On one hand, properly prompted large language models (LLMs) have demonstrated emergent capabilities to carry out several steps of reasoning traces to derive answers from questions in arithmetic, commonsense, and symbolic reasoning tasks . However, this ``chain-of-thought’' reasoning is a static black box, in that the model uses its own internal representations to generate thoughts and is not grounded in the external world, which limits its ability to reason reactively or update its knowledge. This can lead to issues like fact hallucination and error propagation over the reasoning process (Figure (1b)). On the other hand, recent work has explored the use of pre-trained language models for planning and acting in interactive environments , with a focus on predicting actions via language priors. These approaches usually convert multi-modal observations into text, use a language model to generate domain-specific actions or plans, and then use a controller to choose or execute them. However, they do not employ language models to reason abstractly about high-level goals or maintain a working memory to support acting, barring who perform a limited form of verbal reasoning to reiterate spatial facts about the current state. Beyond such simple embodied tasks to interact with a few blocks, there have not been studies on how reasoning and acting can be combined in a synergistic manner for general task solving, and if such a combination can bring systematic benefits compared to reasoning or acting alone. In this work, we present METHOD_X, a general paradigm to combine reasoning and acting with language models for solving diverse language reasoning and decision making tasks (Figure ). METHOD_X prompts LLMs to generate both verbal reasoning traces and actions pertaining to a task in an interleaved manner, which allows the model to perform dynamic reasoning to create, maintain, and adjust high-level plans for acting (reason to act), while also interact with the external environments (e.g.\\,Wikipedia) to incorporate additional information into reasoning (act to reason). The best approach overall is a combination of METHOD_X and REASONING_BASELINE that allows for the use of both internal knowledge and externally obtained information during reasoning. We also demonstrate the importance of sparse, versatile reasoning in decision making by showing consistent advantages over controlled baselines with actions only. Besides general applicability and performance boost, the combination of reasoning and acting also contributes to model interpretability, trustworthiness, and diagnosability across all domains, as humans can readily distinguish information from model's internal knowledge versus external environments, as well as inspect reasoning traces to understand the decision basis of model actions. To summarize, our key contributions are the following: (1) we introduce METHOD_X, a novel prompt-based paradigm to synergize reasoning and acting in language models for general task solving; (2) we perform extensive experiments across diverse benchmarks to showcase the advantage of METHOD_X in a few-shot learning setup over prior approaches that perform either reasoning or action generation in isolation; (3) we present systematic ablations and analysis to understand the importance of acting in reasoning tasks, and reasoning in interactive tasks; (4) we analyze the limitations of METHOD_X under the prompting setup (i.e.\\,limited support of reasoning and acting behaviors), and perform initial finetuning experiments showing the potential of METHOD_X to improve with additional training data. Scaling up METHOD_X to train and operate on more tasks and combining it with complementary paradigms like reinforcement learning could further unlock the potential of large language models.", "method": "METHOD_X: Synergizing Reasoning + Acting Consider a general setup of an agent interacting with an environment for task solving. At time step , an agent receives an observation from the environment and takes an action following some policy , where is the context to the agent. Learning a policy is challenging when the mapping is highly implicit and requires extensive computation. For example, the agent shown in Figure (1c) is unable to generate the correct final action (Act 4) to finish the QA task as it requires complex reasoning over the trajectory context (Question, Act 1-3, Obs 1-3). Similarly, the agent shown in Figure (2a) fails to comprehend from the context that sinkbasin 1 does not contain peppershaker 1, thus keep producing hallucinating actions. The idea of METHOD_X is simple: we augment the agent's action space to , where is the space of language. An action in the language space, which we will refer to as a thought or a reasoning trace, does not affect the external environment, thus leading to no observation feedback. Instead, a thought aims to compose useful information by reasoning over the current context , and update the context to support future reasoning or acting. As shown in Figure , there could be various types of useful thoughts, e.g.\\,decomposing task goals and create action plans (2b, Act 1; 1d, Thought 1), injecting commonsense knowledge relevant to task solving (2b, Act 1), extracting important parts from observations (1d, Thought2, 4), track progress and transit action plans (2b, Act 8), handle exceptions and adjust action plans (1d, Thought 3), and so on. However, as the language space is unlimited, learning in this augmented action space is difficult and requires strong language priors. , is prompted with few-shot in-context examples to generate both domain-specific actions and free-form language thoughts for task solving (Figure (1d), (2b)). Each in-context example is a human trajectory of actions, thoughts, and environment observations to solve a task instance (see Appendix ). For the tasks where reasoning is of primary importance (Figure (1)), we alternate the generation of thoughts and actions so that the task-solving trajectory consists of multiple thought-action-observation steps. In contrast, for decision making tasks that potentially involve a large number of actions (Figure (2)), thoughts only need to appear sparsely in the most relevant positions of a trajectory, so we let the language model decide the asynchronous occurrence of thoughts and actions for ve_environment", "retrieval_tool"], "output_types": ["action_trajectory", "classification_label", "short_answer", "supporting_evidence"], "capabilities": ["evidence_grounding", "external_information_retrieval", "long_horizon_planning", "reasoning_action_interleaving", "tool_use"], "candidate_metrics": ["evidence_score", "exact_match", "label_accuracy", "task_success_rate", "token_f1", "trajectory_efficiency"], "evidence_terms": {"task:embodied_household": ["embodied"], "task:fact_verification": ["fact verification"], "task:knowledge_intensive_qa": ["answer questions", "wikipedia"], "task:sequential_decision_making": ["sequential decision", "action-observation", "trajectory", "interactive environment"], "task:web_navigation": ["web navigation"]}}, "source_policy": "use only licensed train/development records from named base benchmarks", "generation_modules": [{"name": "compositional_recombination", "purpose": "combine independent train-split constraints while preserving executable gold checks"}, {"name": "counterfactual_perturbation", "purpose": "change one controlled factor and regenerate the expected answer with a deterministic verifier"}, {"name": "interaction_wrapper", "purpose": "convert static examples into tool or environment episodes with logged action contracts"}], "record_schema": ["synthetic_id", "source_benchmark", "source_split", "source_record_ids", "transformation", "input", "expected_output", "deterministic_checks", "human_review_status"], "quality_gates": ["exact and near-duplicate filtering against every split", "deterministic execution or answer verification where available", "stratified human review by task family and difficulty", "pilot inter-rater agreement before scaling annotation", "frozen test set before method tuning"], "profile_snapshot": {"task_families": ["embodied_household", "fact_verification", "knowledge_intensive_qa", "sequential_decision_making", "web_navigation"], "uncovered_task_families": [], "modalities": ["audio", "text", "web"], "interactions": ["browser", "interactive_environment", "retrieval_tool"], "output_types": ["action_trajectory", "classification_label", "short_answer", "supporting_evidence"], "capabilities": ["evidence_grounding", "external_information_retrieval", "long_horizon_planning", "reasoning_action_interleaving", "tool_use"], "suggested_metrics": ["evidence_score", "exact_match", "label_accuracy", "task_success_rate", "token_f1", "trajectory_efficiency"]}, "catalog_admission_proposals": [], "execution": {"status": "NOT_REQUIRED", "route": "direct_portfolio", "reason": "the selected portfolio covers every inferred task family", "modules": []}}, "matching_provenance": {"input_fields": ["introduction", "method", "constraints"], "blind_gold_loaded": false, "leakage_scan": {"passed": true, "benchmark_alias_hits": [], "identity_hits": [], "generic_evaluation_terms": []}, "catalog_records": 20, "online_search": false, "decision_backend": "deterministic_profile_and_weighted_compatibility_v1"}, "source_plan": "assets/output/end_to_end_demo/direct/benchmark_plan.json"}, {"case_id": "case_001", "benchmark_id": "webshop", "visible_input": {"introduction": "Introduction. A unique feature of human intelligence is the ability to seamlessly combine task-oriented actions with verbal reasoning (or inner speech, ), which has been theorized to play an important role in human cognition for enabling self-regulation or strategization and maintaining a working memory . Consider the example of cooking up a dish in the kitchen. Between any two specific actions, we may reason in language in order to track progress (``now that everything is cut, I should heat up the pot of water’’), to handle exceptions or adjust the plan according to the situation (``I don’t have salt, so let me use soy sauce and pepper instead’’), and to realize when external information is needed (``how do I prepare dough? Let me search on the Internet’’). We may also act (open a cookbook to read the recipe, open the fridge, check ingredients) to support the reasoning and to answer questions (``What dish can I make right now?''). This tight synergy between ``acting'’ and ``reasoning'’ allows humans to learn new tasks quickly and perform robust decision making or reasoning, even under previously unseen circumstances or facing information uncertainties. Recent results have hinted at the possibility of combining verbal reasoning with interactive decision making in autonomous systems. On one hand, properly prompted large language models (LLMs) have demonstrated emergent capabilities to carry out several steps of reasoning traces to derive answers from questions in arithmetic, commonsense, and symbolic reasoning tasks . However, this ``chain-of-thought’' reasoning is a static black box, in that the model uses its own internal representations to generate thoughts and is not grounded in the external world, which limits its ability to reason reactively or update its knowledge. This can lead to issues like fact hallucination and error propagation over the reasoning process (Figure (1b)). On the other hand, recent work has explored the use of pre-trained language models for planning and acting in interactive environments , with a focus on predicting actions via language priors. These approaches usually convert multi-modal observations into text, use a language model to generate domain-specific actions or plans, and then use a controller to choose or execute them. However, they do not employ language models to reason abstractly about high-level goals or maintain a working memory to support acting, barring who perform a limited form of verbal reasoning to reiterate spatial facts about the current state. Beyond such simple embodied tasks to interact with a few blocks, there have not been studies on how reasoning and acting can be combined in a synergistic manner for general task solving, and if such a combination can bring systematic benefits compared to reasoning or acting alone. In this work, we present METHOD_X, a general paradigm to combine reasoning and acting with language models for solving diverse language reasoning and decision making tasks (Figure ). METHOD_X prompts LLMs to generate both verbal reasoning traces and actions pertaining to a task in an interleaved manner, which allows the model to perform dynamic reasoning to create, maintain, and adjust high-level plans for acting (reason to act), while also interact with the external environments (e.g.\\,Wikipedia) to incorporate additional information into reasoning (act to reason). The best approach overall is a combination of METHOD_X and REASONING_BASELINE that allows for the use of both internal knowledge and externally obtained information during reasoning. We also demonstrate the importance of sparse, versatile reasoning in decision making by showing consistent advantages over controlled baselines with actions only. Besides general applicability and performance boost, the combination of reasoning and acting also contributes to model interpretability, trustworthiness, and diagnosability across all domains, as humans can readily distinguish information from model's internal knowledge versus external environments, as well as inspect reasoning traces to understand the decision basis of model actions. To summarize, our key contributions are the following: (1) we introduce METHOD_X, a novel prompt-based paradigm to synergize reasoning and acting in language models for general task solving; (2) we perform extensive experiments across diverse benchmarks to showcase the advantage of METHOD_X in a few-shot learning setup over prior approaches that perform either reasoning or action generation in isolation; (3) we present systematic ablations and analysis to understand the importance of acting in reasoning tasks, and reasoning in interactive tasks; (4) we analyze the limitations of METHOD_X under the prompting setup (i.e.\\,limited support of reasoning and acting behaviors), and perform initial finetuning experiments showing the potential of METHOD_X to improve with additional training data. Scaling up METHOD_X to train and operate on more tasks and combining it with complementary paradigms like reinforcement learning could further unlock the potential of large language models.", "method": "METHOD_X: Synergizing Reasoning + Acting Consider a general setup of an agent interacting with an environment for task solving. At time step , an agent receives an observation from the environment and takes an action following some policy , where is the context to the agent. Learning a policy is challenging when the mapping is highly implicit and requires extensive computation. For example, the agent shown in Figure (1c) is unable to generate the correct final action (Act 4) to finish the QA task as it requires complex reasoning over the trajectory context (Question, Act 1-3, Obs 1-3). Similarly, the agent shown in Figure (2a) fails to comprehend from the context that sinkbasin 1 does not contain peppershaker 1, thus keep producing hallucinating actions. The idea of METHOD_X is simple: we augment the agent's action space to , where is the space of language. An action in the language space, which we will refer to as a thought or a reasoning trace, does not affect the external environment, thus leading to no observation feedback. Instead, a thought aims to compose useful information by reasoning over the current context , and update the context to support future reasoning or acting. As shown in Figure , there could be various types of useful thoughts, e.g.\\,decomposing task goals and create action plans (2b, Act 1; 1d, Thought 1), injecting commonsense knowledge relevant to task solving (2b, Act 1), extracting important parts from observations (1d, Thought2, 4), track progress and transit action plans (2b, Act 8), handle exceptions and adjust action plans (1d, Thought 3), and so on. However, as the language space is unlimited, learning in this augmented action space is difficult and requires strong language priors. , is prompted with few-shot in-context examples to generate both domain-specific actions and free-form language thoughts for task solving (Figure (1d), (2b)). Each in-context example is a human trajectory of actions, thoughts, and environment observations to solve a task instance (see Appendix ). For the tasks where reasoning is of primary importance (Figure (1)), we alternate the generation of thoughts and actions so that the task-solving trajectory consists of multiple thought-action-observation steps. In contrast, for decision making tasks that potentially involve a large number of actions (Figure (2)), thoughts only need to appear sparsely in the most relevant positions of a trajectory, so we let the language model decide the asynchronous occurrence of thoughts and actions for itself. Since decision making and reasoning capabilities are integrated into a large language model, METHOD_X enjoys several unique features: A) Intuitive and easy to design: Designing METHOD_X prompts is straightforward as human annotators just type down their thoughts in language on top of their actions taken. No ad-hoc format choice, thought design, or example selection is used in this paper. We detail prompt design for each task in Sections and . B) General and flexible: Due to the flexible thought space and thought-action occurrence format, METHOD_X works for diverse tasks with distinct action spaces and reasoning needs, including but not limited to QA, fact verification, text game, and web navigation. We also show in Section additional benefits when finetuning is enabled, and in Section how METHOD_X performance is robust to prompt selections. D) Human aligned and controllable: METHOD_X promises an interpretable sequential decision making and reasoning process where humans can easily inspect reasoning and factual correctness. Moreover, humans can also control or correct the agent behavior on the go by thought editing, as shown in Figure in Section ."   <script>
    const assignment = JSON.parse(document.getElementById('assignment-data').textContent);
    const dimensions = assignment.rubric_dimensions;
    const guide = document.getElementById('rubric-guide');
    dimensions.forEach((dimension) => {
      const row = document.createElement('div');
      row.className = 'rubric';
      const label = document.createElement('div');
      label.innerHTML = '<strong>' + dimension + '</strong><small></small>';
      label.querySelector('small').textContent = assignment.rubric_guidance[dimension];
      const scale = document.createElement('div');
      scale.textContent = '1 = weak · 5 = strong';
      row.append(label, scale);
      guide.appendChild(row);
    });

    function jsonBlock(value) {
      const pre = document.createElement('pre');
      pre.textContent = JSON.stringify(value, null, 2);
      return pre;
    }

    function addDetails(parent, title, value, open) {
      const details = document.createElement('details');
      details.open = Boolean(open);
      const summary = document.createElement('summary');
      summary.textContent = title;
      details.append(summary, jsonBlock(value));
      parent.appendChild(details);
    }

    function renderItems() {
      const root = document.getElementById('items');
      assignment.items.forEach((item, index) => {
        const article = document.createElement('article');
        article.className = 'item';
        article.dataset.index = String(index);
        const head = document.createElement('div');
        head.className = 'item-head';
        const heading = document.createElement('h2');
        heading.textContent = (index + 1) + '. ' + item.case_id + ' / ' + item.benchmark_id;
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = 'Route: ' + item.route + ' · Coverage: ' + Number(item.coverage_ratio * 100).toFixed(1) + '%';
        head.append(heading, meta);
        const body = document.createElement('div');
        body.className = 'item-body';

        const inputTitle = document.createElement('h3');
        inputTitle.textContent = 'Matcher-visible Introduction';
        body.append(inputTitle, jsonBlock(item.visible_input.introduction));
        const methodTitle = document.createElement('h3');
        methodTitle.textContent = 'Matcher-visible Method';
        body.append(methodTitle, jsonBlock(item.visible_input.method));

        const candidateTitle = document.createElement('h3');
        candidateTitle.textContent = 'Review target: ' + item.candidate.name;
        body.appendChild(candidateTitle);
        if (item.candidate.source_url) {
          const link = document.createElement('a');
          link.href = item.candidate.source_url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = '打开候选 Benchmark 的主来源';
          body.appendChild(link);
        }
        addDetails(body, 'Capability profile', item.profile, true);
        addDetails(body, 'Selected candidate evidence and metric plan', item.candidate, true);
        addDetails(body, 'All ranked candidates', item.ranked_candidates, false);
        addDetails(body, 'Catalog admission proposals', item.catalog_admission_proposals, false);
        addDetails(body, 'Adaptation plan', item.adaptation_plan, true);
        addDetails(body, 'Synthesis plan', item.synthesis_plan, true);
        addDetails(body, 'Matching provenance', item.matching_provenance, false);

        const scoreTitle = document.createElement('h3');
        scoreTitle.textContent = 'Human suitability scores';
        body.appendChild(scoreTitle);
        dimensions.forEach((dimension) => {
          const row = document.createElement('div');
          row.className = 'rubric';
          const label = document.createElement('label');
          label.htmlFor = 'score-' + index + '-' + dimension;
          label.textContent = dimension;
          const small = document.createElement('small');
          small.textContent = assignment.rubric_guidance[dimension];
          label.appendChild(small);
          const input = document.createElement('input');
          input.type = 'number';
          input.min = '1';
          input.max = '5';
          input.step = '1';
          input.id = 'score-' + index + '-' + dimension;
          input.dataset.dimension = dimension;
          input.addEventListener('input', updateProgress);
          row.append(label, input);
          body.appendChild(row);
        });

        const provenanceLabel = document.createElement('label');
        provenanceLabel.className = 'check';
        provenanceLabel.innerHTML = '<input type="checkbox" data-field="provenance"><span>我已打开并核对候选 Benchmark 的主来源及所列指标；对于新合成方案，我已核对其 base 数据来源与变换记录。</span>';
        provenanceLabel.querySelector('input').addEventListener('change', updateProgress);
        body.appendChild(provenanceLabel);

        const decisionLabel = document.createElement('label');
        decisionLabel.innerHTML = '<strong>Decision</strong>';
        const select = document.createElement('select');
        select.dataset.field = 'decision';
        select.innerHTML = '<option value="">请选择</option><option value="APPROVE">APPROVE</option><option value="REJECT">REJECT</option>';
        select.addEventListener('change', updateProgress);
        decisionLabel.appendChild(select);
        body.appendChild(decisionLabel);

        const notesLabel = document.createElement('label');
        notesLabel.innerHTML = '<strong>Concrete justification</strong>';
        const notes = document.createElement('textarea');
        notes.dataset.field = 'notes';
        notes.placeholder = '写明至少一个与方法能力、任务覆盖、指标或数据质量直接相关的判断依据。';
        notes.addEventListener('input', updateProgress);
        notesLabel.appendChild(notes);
        body.appendChild(notesLabel);
        article.append(head, body);
        root.appendChild(article);
      });
    }

    function collect(validate) {
      const reviewerId = document.getElementById('reviewer-id').value.trim();
      const independence = document.getElementById('independence').checked;
      const errors = [];
      if (!reviewerId) errors.push('Reviewer ID 未填写');
      if (['reviewer_1','reviewer_2','reviewer1','reviewer2','r1','r2','anonymous','anon','placeholder'].includes(reviewerId.toLowerCase().replaceAll('-', '_').replaceAll(' ', '_'))) errors.push('Reviewer ID 仍是模板占位符');
      if (!independence) errors.push('独立评审声明未确认');
      const reviews = assignment.items.map((item, index) => {
        const article = document.querySelector('.item[data-index="' + index + '"]');
        const scores = {};
        dimensions.forEach((dimension) => {
          const raw = article.querySelector('[data-dimension="' + dimension + '"]').value;
          scores[dimension] = raw === '' ? null : Number(raw);
          if (validate && (scores[dimension] === null || scores[dimension] < 1 || scores[dimension] > 5)) errors.push(item.case_id + '/' + item.benchmark_id + ': ' + dimension + ' 需要 1–5 分');
        });
        const provenance = article.querySelector('[data-field="provenance"]').checked;
        const decision = article.querySelector('[data-field="decision"]').value;
        const notes = article.querySelector('[data-field="notes"]').value.trim();
        if (validate && !provenance) errors.push(item.case_id + '/' + item.benchmark_id + ': 来源确认未勾选');
        if (validate && !decision) errors.push(item.case_id + '/' + item.benchmark_id + ': Decision 未填写');
        if (validate && !notes) errors.push(item.case_id + '/' + item.benchmark_id + ': 判断依据未填写');
        return {
          case_id: item.case_id,
          benchmark_id: item.benchmark_id,
          reviewer_slot: assignment.reviewer_slot,
          reviewer_id: reviewerId || null,
          scores: scores,
          provenance_confirmed: provenance,
          independence_attested: independence,
          decision: decision || null,
          notes: notes || null
        };
      });
      return {reviews: reviews, errors: errors};
    }

    function checkedItemCount() {
      const result = collect(false).reviews;
      return result.filter((review) => dimensions.every((dimension) => review.scores[dimension] !== null) && review.provenance_confirmed && review.decision && review.notes).length;
    }

    function updateProgress() {
      document.getElementById('progress').textContent = '完成 ' + checkedItemCount() + ' / ' + assignment.items.length;
    }

    function validatedPayload() {
      const result = collect(true);
      const message = document.getElementById('message');
      if (result.errors.length) {
        message.textContent = '尚有 ' + result.errors.length + ' 项：' + result.errors.join('；');
        return null;
      }
      message.textContent = '校验通过';
      return {
        schema_version: assignment.schema_version,
        reviewer_slot: assignment.reviewer_slot,
        reviews: result.reviews
      };
    }

    document.getElementById('download').addEventListener('click', () => {
      const payload = validatedPayload();
      if (!payload) return;
      const blob = new Blob([JSON.stringify(payload, null, 2) + '\n'], {type:'application/json'});
      const anchor = document.createElement('a');
      anchor.href = URL.createObjectURL(blob);
      anchor.download = assignment.reviewer_slot.toLowerCase() + '_submission.json';
      anchor.click();
      URL.revokeObjectURL(anchor.href);
    });

    document.getElementById('copy').addEventListener('click', async () => {
      const payload = validatedPayload();
      if (!payload) return;
      await navigator.clipboard.writeText(JSON.stringify(payload, null, 2) + '\n');
      document.getElementById('message').textContent = '校验通过并已复制';
    });

    document.getElementById('reviewer-id').addEventListener('input', updateProgress);
    document.getElementById('independence').addEventListener('change', updateProgress);
    renderItems();
    updateProgress();
  </script>
