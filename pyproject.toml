[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autodesign"
version = "0.4.0"
description = "Thin execution and artifact verification for Skill-first AutoDesign."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AutoDesign" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
autodesign = "autodesign.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["autodesign*"]

[tool.ruff]
line-length = 100
target-version = "py39"
